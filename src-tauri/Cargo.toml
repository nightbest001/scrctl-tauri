[package]
name = "scrctl"
version = "0.5.0"
description = "SCRCTL - control panel scrcpy buatan sendiri (Tauri + Rust)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "process", "sync", "time", "macros", "fs"] }
arboard = { version = "3", default-features = false }
regex = "1"
rand = "0.8"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_Input_KeyboardAndMouse"] }
windows = { version = "0.58", features = ["Media_Control", "Foundation", "Win32_System_WinRT"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
