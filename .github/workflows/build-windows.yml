name: Build Windows

on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # adb ikut ter-bundle supaya app jalan tanpa install platform-tools terpisah
      - name: Download Android platform-tools (adb)
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force src-tauri/resources/platform-tools | Out-Null
          foreach ($f in 'adb.exe','AdbWinApi.dll','AdbWinUsbApi.dll') {
            Copy-Item "pt/platform-tools/$f" src-tauri/resources/platform-tools/
          }
          Get-ChildItem src-tauri/resources/platform-tools

      # Tag v0.4.0 -> versi app 0.4.0 (dipakai cek update di dalam app)
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}".TrimStart('v')
          $p = 'src-tauri/tauri.conf.json'
          $c = Get-Content $p -Raw
          $c = $c -replace '"version":\s*"[^"]*"', ('"version": "' + $v + '"')
          [IO.File]::WriteAllText((Resolve-Path $p), $c)
          Select-String -Path $p -Pattern '"version"'

      - name: Install dependencies
        run: npm install

      - name: Build (cek compile + installer)
        shell: pwsh
        run: |
          for ($i = 1; $i -le 3; $i++) {
            npm run build
            if ($LASTEXITCODE -eq 0) { exit 0 }
            Write-Host "Bundle gagal, coba lagi ($i/3)..."
            Start-Sleep -Seconds 20
          }
          Write-Host "Installer gagal terus. Build exe saja tanpa installer."
          npm run build -- --no-bundle
          exit $LASTEXITCODE

      - name: Portable zip (exe + adb)
        shell: pwsh
        run: |
          $d = "portable/Orbit"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item src-tauri/target/release/scrctl.exe $d/Orbit.exe
          Copy-Item -Recurse src-tauri/resources/platform-tools $d/platform-tools
          Copy-Item src-tauri/resources/LICENSE-scrcpy.txt $d/
          Compress-Archive -Path portable/Orbit -DestinationPath Orbit-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-windows
          path: |
            Orbit-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe

      - name: Catatan rilis (dari CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          awk -v t="## ${GITHUB_REF_NAME}" 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || awk '/^## Belum dirilis/{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md

      - name: Release (kalau push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            Orbit-portable.zip
            src-tauri/target/release/bundle/nsis/*.exe
