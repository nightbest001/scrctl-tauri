name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah ada di runner ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Tag v0.6.1 -> versionName 0.6.1, versionCode 601 (dipakai cek update di app HP)
      - name: Build APK (release)
        working-directory: android
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
            IFS=. read -r MA MI PA <<< "$V"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
            gradle --no-daemon assembleRelease -PappVersion="$V" -PappCode="$CODE"
          else
            gradle --no-daemon assembleRelease
          fi

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk Orbit-Link.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Link
          path: Orbit-Link.apk

      - name: Attach to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Orbit-Link.apk
