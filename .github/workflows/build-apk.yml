name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah ada di runner ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Tag v0.6.1 -> versionName 0.6.1, versionCode 601 (dipakai cek update di app HP)
      # Tanpa tag: versi diambil dari src-tauri/tauri.conf.json
      - name: Tentukan versi
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V=$(grep -m1 '"version"' src-tauri/tauri.conf.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')
          fi
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"

      - name: Build APK (release)
        working-directory: android
        run: |
          IFS=. read -r MA MI PA <<< "$APP_VERSION"
          CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))
          gradle --no-daemon assembleRelease -PappVersion="$APP_VERSION" -PappCode="$CODE"

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk "Orbit-Link-v${APP_VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: Orbit-Link-v${{ env.APP_VERSION }}
          path: Orbit-Link-v${{ env.APP_VERSION }}.apk

      - name: Catatan rilis (dari CHANGELOG.md)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          awk -v t="## ${GITHUB_REF_NAME}" 'index($0,t)==1{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md
          [ -s release-notes.md ] || awk '/^## Belum dirilis/{f=1;next} /^## /{f=0} f' CHANGELOG.md > release-notes.md

      - name: Attach to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: Orbit-Link-v${{ env.APP_VERSION }}.apk
