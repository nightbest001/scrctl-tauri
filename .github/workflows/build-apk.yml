name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Android SDK sudah ada di runner ubuntu-latest (ANDROID_HOME)
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build APK (release, ditandatangani debug key)
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk SCRCTL-Link.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SCRCTL-Link
          path: SCRCTL-Link.apk

      - name: Attach to GitHub Release (tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: SCRCTL-Link.apk
